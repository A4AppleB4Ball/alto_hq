schema: evidence/v1
file: engineering/tasks/<year>/T-…/evidence.md

required:
  schema: {type: text}
  task: {type: ref}
  qa: {type: enum, values: [pass, fail]}
  qa_by: {type: ref, note: "role@version of the QA run"}
  outputs_changed: {type: enum, values: ["yes", "no"], note: "golden companies, before vs after"}

optional:
  merge_commit: {type: text, note: "the commit on develop or live; never a branch commit"}
  runs: {type: list, of: text, note: "run ids that produced this evidence"}

required_when:
  merge_commit: "the task's status is done"

body: [What changed, How it was checked, Acceptance check result, Risks]
